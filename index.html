// ============================================================================
// OBD2 / ELM327 PROTOCOL LAYER
// ============================================================================
// BLE ELM327-adapters gebruiken meestal een UART-achtige service. De exacte
// UUIDs verschillen per fabrikant/chipset — hieronder de meest voorkomende.
// Als jouw adapter niet verbindt, gebruikt hij waarschijnlijk een ander
// UUID-paar; die vind je dan in de datasheet van de adapter.

const KNOWN_UART_SERVICES = [
  {
    name: 'Nordic UART (NUS)',
    service: '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
    write: '6e400002-b5a3-f393-e0a9-e50e24dcca9e',
    notify: '6e400003-b5a3-f393-e0a9-e50e24dcca9e',
  },
  {
    name: 'Vgate/OBDLink-stijl',
    service: '18f0',
    write: '2af1',
    notify: '2af0',
  },
];

const PIDS = {
  RPM: { pid: '010C', bytes: 2, parse: (a, b) => ((a * 256) + b) / 4, unit: 'RPM', max: 7000 },
  SPEED: { pid: '010D', bytes: 1, parse: (a) => a, unit: 'km/h', max: 220 },
  COOLANT_TEMP: { pid: '0105', bytes: 1, parse: (a) => a - 40, unit: '°C', max: 120 },
  ENGINE_LOAD: { pid: '0104', bytes: 1, parse: (a) => (a * 100) / 255, unit: '%', max: 100 },
  FUEL_LEVEL: { pid: '012F', bytes: 1, parse: (a) => (a * 100) / 255, unit: '%', max: 100 },
  VOLTAGE: { pid: 'ATRV', bytes: 0, parse: null, unit: 'V', max: 16 },
};

const DTC_DATABASE = {
  P0301: { title: 'Ontsteking mist — cilinder 1', severity: 'high', explanation: 'Cilinder 1 ontbrandt het mengsel niet goed. Vaak een bougie, spoel of injector die aan vervanging toe is.', action: 'Laat bougies en ontstekingsspoel van cilinder 1 controleren.' },
  P0302: { title: 'Ontsteking mist — cilinder 2', severity: 'high', explanation: 'Cilinder 2 ontbrandt het mengsel niet goed.', action: 'Laat bougies en ontstekingsspoel van cilinder 2 controleren.' },
  P0420: { title: 'Katalysator werkt onvoldoende', severity: 'medium', explanation: 'De katalysator zuivert de uitlaatgassen niet meer zoals hij zou moeten.', action: 'Controleer eerst de zuurstofsensoren voor je de kat vervangt.' },
  P0171: { title: 'Mengsel te mager — bank 1', severity: 'medium', explanation: 'Er komt te veel lucht of te weinig brandstof het systeem in.', action: 'Controleer op vacuümlekken en reinig de luchtmassameter.' },
  P0128: { title: 'Koelvloeistof bereikt temperatuur niet', severity: 'low', explanation: 'De motor warmt trager op dan verwacht.', action: 'Thermostaat laten vervangen.' },
  P0442: { title: 'Klein lek in verdampingssysteem', severity: 'low', explanation: 'Er zit een klein lek in het brandstofdampsysteem, vaak de tankdop.', action: 'Controleer of de tankdop goed sluit.' },
};

function decodeDTC(hexPair) {
  const firstByte = parseInt(hexPair.substring(0, 2), 16);
  const letterMap = ['P', 'C', 'B', 'U'];
  const letter = letterMap[(firstByte & 0xC0) >> 6];
  const firstDigit = (firstByte & 0x30) >> 4;
  const rest = hexPair.substring(0, 2).padStart(2, '0').substring(1) + hexPair.substring(2, 4);
  return `${letter}${firstDigit}${rest}`;
}

class OBD2Connection {
  constructor() {
    this.device = null;
    this.server = null;
    this.writeChar = null;
    this.notifyChar = null;
    this.buffer = '';
    this.responseResolvers = [];
    this.onLog = null;
    this.onDisconnect = null;
  }

  log(msg) { if (this.onLog) this.onLog(msg); }

  async connect() {
    if (!navigator.bluetooth) throw new Error('WEB_BLUETOOTH_UNSUPPORTED');

    this.log('Bluetooth-apparaat kiezen…');
    this.device = await navigator.bluetooth.requestDevice({
      filters: KNOWN_UART_SERVICES.map(s => ({ services: [s.service] })),
      optionalServices: KNOWN_UART_SERVICES.map(s => s.service),
    });

    this.device.addEventListener('gattserverdisconnected', () => {
      this.log('Verbinding verbroken');
      if (this.onDisconnect) this.onDisconnect();
    });

    this.log(`Verbinden met ${this.device.name || 'adapter'}…`);
    this.server = await this.device.gatt.connect();

    let matched = null;
    for (const cfg of KNOWN_UART_SERVICES) {
      try {
        const service = await this.server.getPrimaryService(cfg.service);
        const writeChar = await service.getCharacteristic(cfg.write);
        const notifyChar = await service.getCharacteristic(cfg.notify);
        matched = { service, writeChar, notifyChar, name: cfg.name };
        break;
      } catch (e) { continue; }
    }

    if (!matched) throw new Error('NO_MATCHING_SERVICE');

    this.log(`Protocol herkend: ${matched.name}`);
    this.writeChar = matched.writeChar;
    this.notifyChar = matched.notifyChar;

    await this.notifyChar.startNotifications();
    this.notifyChar.addEventListener('characteristicvaluechanged', (event) => {
      const value = new TextDecoder().decode(event.target.value);
      this.buffer += value;
      if (this.buffer.includes('>')) {
        const complete = this.buffer;
        this.buffer = '';
        const resolver = this.responseResolvers.shift();
        if (resolver) resolver(complete);
      }
    });

    await this.sendCommand('ATZ', 2000);
    await this.sendCommand('ATE0', 500);
    await this.sendCommand('ATL0', 500);
    await this.sendCommand('ATSP0', 500);
    this.log('Adapter geïnitialiseerd');

    return true;
  }

  async sendCommand(cmd, timeout = 3000) {
    if (!this.writeChar) throw new Error('NOT_CONNECTED');

    return new Promise(async (resolve, reject) => {
      const timer = setTimeout(() => {
        const idx = this.responseResolvers.indexOf(resolve);
        if (idx > -1) this.responseResolvers.splice(idx, 1);
        reject(new Error('TIMEOUT'));
      }, timeout);

      this.responseResolvers.push((raw) => {
        clearTimeout(timer);
        resolve(raw.replace(/>/g, '').trim());
      });

      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(cmd + '\r');
        const chunkSize = 20;
        for (let i = 0; i < data.length; i += chunkSize) {
          await this.writeChar.writeValue(data.slice(i, i + chunkSize));
        }
      } catch (e) {
        clearTimeout(timer);
        reject(e);
      }
    });
  }

  async readPID(pidDef) {
    const raw = await this.sendCommand(pidDef.pid);
    if (pidDef.pid === 'ATRV') {
      const match = raw.match(/([\d.]+)V/);
      return match ? parseFloat(match[1]) : null;
    }
    const hexBytes = raw.replace(/\s/g, '').match(/.{1,2}/g) || [];
    const pidHex = pidDef.pid.substring(2);
    const idx = hexBytes.findIndex((b, i) => b.toUpperCase() === pidHex.toUpperCase() && i < hexBytes.length - 1);
    if (idx === -1) return null;
    const dataBytes = hexBytes.slice(idx + 1, idx + 1 + pidDef.bytes).map(b => parseInt(b, 16));
    if (dataBytes.some(isNaN)) return null;
    return pidDef.parse(...dataBytes);
  }

  async readFaultCodes() {
    const raw = await this.sendCommand('03', 5000);
    const clean = raw.replace(/\s/g, '').replace(/^43/, '');
    if (clean.startsWith('NODATA') || clean === '' || raw.includes('NO DATA')) return [];
    const codes = [];
    const hexBytes = clean.match(/.{1,2}/g) || [];
    for (let i = 0; i < hexBytes.length; i += 2) {
      if (i + 1 >= hexBytes.length) break;
      const pair = hexBytes[i] + hexBytes[i + 1];
      if (pair === '0000') continue;
      codes.push(decodeDTC(pair));
    }
    return codes;
  }

  async clearFaultCodes() {
    const raw = await this.sendCommand('04', 5000);
    return raw.includes('44') || raw.toUpperCase().includes('OK');
  }

  async disconnect() {
    if (this.device && this.device.gatt.connected) this.device.gatt.disconnect();
  }
}

// ============================================================================
// UI COMPONENTS
// ============================================================================

function Gauge_({ value, max, label, unit, color, icon: IconComp, decimals = 0 }) {
  const safeValue = value ?? 0;
  const pct = Math.min(1, safeValue / max);
  return (
    <div className="obd-gauge">
      <div className="obd-gauge-ring" style={{ '--pct': pct, '--color': color }}>
        <div className="obd-gauge-face">
          <IconComp size={16} className="obd-gauge-icon" style={{ color }} />
          <div className="obd-gauge-value">{value === null ? '—' : safeValue.toFixed(decimals)}</div>
          <div className="obd-gauge-unit">{unit}</div>
        </div>
      </div>
      <div className="obd-gauge-label">{label}</div>
    </div>
  );
}

function ConnectScreen({ onConnect, status, errorMsg, logs }) {
  const unsupported = errorMsg === 'WEB_BLUETOOTH_UNSUPPORTED';
  return (
    <div className="obd-connect-screen">
      <div className="obd-connect-glow" />
      <div className="obd-connect-icon">
        {status === 'connecting' ? <IconBluetoothConnected size={40} className="obd-pulse" /> : <IconBluetooth size={40} />}
      </div>
      <h1 className="obd-connect-title">DIAGNOSE<span className="obd-connect-title-accent">.LINK</span></h1>
      <p className="obd-connect-sub">
        {status === 'connecting' ? 'Verbinding maken met OBD2-adapter…' : 'Verbind met een echte BLE OBD2-adapter in je auto'}
      </p>

      {unsupported && (
        <div className="obd-error-box">
          <IconAlertTriangle size={16} />
          <span>Deze browser ondersteunt geen Web Bluetooth. Gebruik Chrome of Edge op Windows, macOS of Android.</span>
        </div>
      )}
      {errorMsg && errorMsg !== 'WEB_BLUETOOTH_UNSUPPORTED' && (
        <div className="obd-error-box">
          <IconAlertTriangle size={16} />
          <span>
            {errorMsg === 'NO_MATCHING_SERVICE'
              ? 'Adapter gevonden, maar het communicatieprotocol werd niet herkend. Mogelijk gebruikt jouw adapter een ander BLE-profiel.'
              : errorMsg === 'NotFoundError'
              ? 'Geen adapter geselecteerd of gevonden.'
              : `Verbindingsfout: ${errorMsg}`}
          </span>
        </div>
      )}

      {status !== 'connecting' && !unsupported && (
        <button className="obd-connect-btn" onClick={onConnect}>
          <IconSearch size={16} /> Zoek adapter
        </button>
      )}
      {status === 'connecting' && <div className="obd-connect-scanbar"><div className="obd-connect-scanbar-fill" /></div>}

      {logs.length > 0 && (
        <div className="obd-log-box">
          <div className="obd-log-header"><IconTerminal size={11} /> Verbindingslog</div>
          {logs.map((l, i) => <div key={i} className="obd-log-line">{l}</div>)}
        </div>
      )}

      <div className="obd-connect-hint">Vereist een BLE (Bluetooth Low Energy) ELM327-adapter — Classic/SPP-adapters werken niet via de browser</div>
    </div>
  );
}

function DTCPanel({ codes, onSelect, onClear, clearing, loading }) {
  return (
    <div className="obd-panel">
      <div className="obd-panel-header obd-panel-header-row">
        <span>Foutcodes {loading ? '' : `(${codes.length})`}</span>
        {codes.length > 0 && (
          <button className="obd-clear-btn" onClick={onClear} disabled={clearing}>
            {clearing ? <IconRefreshCw size={12} className="obd-spin" /> : <IconTrash2 size={12} />}
            {clearing ? 'Wissen…' : 'Wis codes'}
          </button>
        )}
      </div>

      {loading && (
        <div className="obd-empty-state">
          <IconRefreshCw size={24} className="obd-spin" color="#8A9099" />
          <div className="obd-empty-sub">Foutcodes uitlezen…</div>
        </div>
      )}

      {!loading && codes.length === 0 && (
        <div className="obd-empty-state">
          <IconCheckCircle2 size={28} color="#3DDC97" />
          <div className="obd-empty-title">Geen foutcodes gevonden</div>
          <div className="obd-empty-sub">Alle systemen melden normaal gedrag</div>
        </div>
      )}

      {!loading && codes.length > 0 && (
        <div className="obd-dtc-list">
          {codes.map(code => {
            const info = DTC_DATABASE[code] || { title: 'Onbekende code — niet in lokale database', severity: 'medium', explanation: 'Deze foutcode staat niet in onze lokale uitlegdatabase. Zoek de code online op of vraag een garage om uitleg.', action: 'Raadpleeg een monteur voor duiding van deze specifieke code.' };
            return (
              <button key={code} className="obd-dtc-row" onClick={() => onSelect(code)}>
                <div className={`obd-dtc-severity obd-sev-${info.severity}`} />
                <div className="obd-dtc-info">
                  <div className="obd-dtc-code">{code}</div>
                  <div className="obd-dtc-title">{info.title}</div>
                </div>
                <IconChevronRight size={16} className="obd-dtc-chevron" />
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function DTCDetail({ code, onClose }) {
  const info = DTC_DATABASE[code] || { title: 'Onbekende code', severity: 'medium', explanation: 'Deze code staat niet in de lokale database.', action: 'Raadpleeg een monteur.' };
  return (
    <div className="obd-modal-backdrop" onClick={onClose}>
      <div className="obd-modal" onClick={e => e.stopPropagation()}>
        <button className="obd-modal-close" onClick={onClose}><IconX size={18} /></button>
        <div className={`obd-dtc-severity obd-sev-${info.severity} obd-modal-sev`} />
        <div className="obd-modal-code">{code}</div>
        <div className="obd-modal-title">{info.title}</div>
        <div className="obd-modal-section">
          <div className="obd-modal-label"><IconInfo size={13} /> Wat betekent dit</div>
          <p>{info.explanation}</p>
        </div>
        <div className="obd-modal-section">
          <div className="obd-modal-label"><IconTrendingUp size={13} /> Aanbevolen actie</div>
          <p>{info.action}</p>
        </div>
      </div>
    </div>
  );
}

function ClearConfirmModal({ onConfirm, onCancel }) {
  return (
    <div className="obd-modal-backdrop" onClick={onCancel}>
      <div className="obd-modal" onClick={e => e.stopPropagation()}>
        <IconAlertTriangle size={28} color="#E8B84B" style={{ marginBottom: 12 }} />
        <div className="obd-modal-title" style={{ marginBottom: 8 }}>Foutcodes wissen?</div>
        <p style={{ fontSize: 13.5, color: '#C4C8CD', lineHeight: 1.6, marginBottom: 20 }}>
          Dit wist het geheugen van de ECU, niet het onderliggende probleem. Als het mankement er nog is, komt de code na een paar ritten vaak terug. Gebruik dit vooral ná een reparatie, om te bevestigen dat het probleem echt weg is.
        </p>
        <div style={{ display: 'flex', gap: 10 }}>
          <button className="obd-modal-cancel" onClick={onCancel}>Annuleren</button>
          <button className="obd-modal-confirm" onClick={onConfirm}>Ja, wis codes</button>
        </div>
      </div>
    </div>
  );
}

// ============================================================================
// MAIN APP
// ============================================================================

function OBD2App() {
  const [status, setStatus] = useState('disconnected');
  const [errorMsg, setErrorMsg] = useState(null);
  const [logs, setLogs] = useState([]);
  const [selectedCode, setSelectedCode] = useState(null);
  const [faultCodes, setFaultCodes] = useState([]);
  const [dtcLoading, setDtcLoading] = useState(false);
  const [clearing, setClearing] = useState(false);
  const [showClearConfirm, setShowClearConfirm] = useState(false);
  const [liveData, setLiveData] = useState({ rpm: null, speed: null, coolant: null, load: null, fuel: null, voltage: null });
  const [toast, setToast] = useState(null);

  const connRef = useRef(null);
  const pollRef = useRef(null);

  const addLog = useCallback((msg) => {
    setLogs(prev => [...prev.slice(-5), msg]);
  }, []);

  const fetchFaultCodes = useCallback(async () => {
    if (!connRef.current) return;
    setDtcLoading(true);
    try {
      const codes = await connRef.current.readFaultCodes();
      setFaultCodes(codes);
    } catch (e) {
      addLog(`Kon foutcodes niet lezen: ${e.message}`);
    }
    setDtcLoading(false);
  }, [addLog]);

  const handleConnect = async () => {
    setErrorMsg(null);
    setLogs([]);
    setStatus('connecting');

    const conn = new OBD2Connection();
    conn.onLog = addLog;
    conn.onDisconnect = () => {
      setStatus('disconnected');
      clearInterval(pollRef.current);
    };

    try {
      await conn.connect();
      connRef.current = conn;
      setStatus('connected');
      fetchFaultCodes();

      pollRef.current = setInterval(async () => {
        try {
          const [rpm, speed, coolant, load, fuel, voltage] = await Promise.all([
            conn.readPID(PIDS.RPM).catch(() => null),
            conn.readPID(PIDS.SPEED).catch(() => null),
            conn.readPID(PIDS.COOLANT_TEMP).catch(() => null),
            conn.readPID(PIDS.ENGINE_LOAD).catch(() => null),
            conn.readPID(PIDS.FUEL_LEVEL).catch(() => null),
            conn.readPID(PIDS.VOLTAGE).catch(() => null),
          ]);
          setLiveData({ rpm, speed, coolant, load, fuel, voltage });
        } catch (e) { /* stille fout tijdens polling */ }
      }, 1000);
    } catch (e) {
      setErrorMsg(e.message);
      setStatus('disconnected');
    }
  };

  const handleClearCodes = async () => {
    setShowClearConfirm(false);
    setClearing(true);
    try {
      await connRef.current.clearFaultCodes();
      setToast('Foutcodes gewist');
      setTimeout(() => setToast(null), 2500);
      await fetchFaultCodes();
    } catch (e) {
      setToast('Wissen mislukt — probeer opnieuw');
      setTimeout(() => setToast(null), 2500);
    }
    setClearing(false);
  };

  useEffect(() => {
    return () => {
      clearInterval(pollRef.current);
      if (connRef.current) connRef.current.disconnect();
    };
  }, []);

  return (
    <div className="obd-app">
      {status !== 'connected' ? (
        <ConnectScreen onConnect={handleConnect} status={status} errorMsg={errorMsg} logs={logs} />
      ) : (
        <>
          <div className="obd-topbar">
            <div className="obd-brand">DIAGNOSE<span className="obd-brand-accent">.LINK</span></div>
            <div className="obd-conn-badge"><IconBluetoothConnected size={12} /> Verbonden</div>
          </div>

          <div className="obd-gauges">
            <Gauge_ value={liveData.rpm} max={7000} label="Toerental" unit="RPM" color="#FF6B35" icon={IconGauge} />
            <Gauge_ value={liveData.speed} max={180} label="Snelheid" unit="KM/H" color="#3DDC97" icon={IconZap} />
            <Gauge_ value={liveData.coolant} max={120} label="Koelvloeistof" unit="°C" color="#4B9FE8" icon={IconThermometer} />
          </div>

          <div className="obd-stats-row">
            <div className="obd-stat-card">
              <div className="obd-stat-icon"><IconFuel size={15} /></div>
              <div>
                <div className="obd-stat-value">{liveData.fuel === null ? '—' : `${liveData.fuel.toFixed(0)}%`}</div>
                <div className="obd-stat-label">Brandstofniveau</div>
              </div>
            </div>
            <div className="obd-stat-card">
              <div className="obd-stat-icon"><IconZap size={15} /></div>
              <div>
                <div className="obd-stat-value">{liveData.voltage === null ? '—' : `${liveData.voltage.toFixed(1)}V`}</div>
                <div className="obd-stat-label">Accuspanning</div>
              </div>
            </div>
          </div>

          <DTCPanel
            codes={faultCodes}
            onSelect={setSelectedCode}
            onClear={() => setShowClearConfirm(true)}
            clearing={clearing}
            loading={dtcLoading}
          />
        </>
      )}

      {selectedCode && <DTCDetail code={selectedCode} onClose={() => setSelectedCode(null)} />}
      {showClearConfirm && <ClearConfirmModal onConfirm={handleClearCodes} onCancel={() => setShowClearConfirm(false)} />}
      {toast && <div className="obd-toast"><IconCheckCircle2 size={15} color="#3DDC97" /> {toast}</div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<OBD2App />);
</script>
</body>
</html>
