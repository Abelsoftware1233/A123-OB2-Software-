<style>

  .obd-modal-backdrop {

  .obd-modal-title { font-size: 15px; color: #E8EAED; margin-top: 2px; margin-bottom: 18px; }

  .obd-modal-label {

  .obd-toast {

    display: flex; align-items: center; gap: 8px;
  }

  @media (prefers-reduced-motion: reduce) {
    .obd-pulse, .obd-connect-scanbar-fill, .obd-spin { animation: none; }
  }
</style>

<script>
'use strict';

// ============================================================================
// SVG ICON HELPERS (geen library nodig)
// ============================================================================
function svgIcon(pathsHtml, size, color, extraAttrs) {

}
var ICONS = {
  bluetooth: '<polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"/>',
  bluetoothConnected: '<polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>',
  alertTriangle: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  checkCircle: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
  gauge: '<path d="M12 14 15.5 10.5"/><path d="M2.5 12A9.5 9.5 0 0 1 12 2.5 9.5 9.5 0 0 1 21.5 12"/><circle cx="12" cy="14" r="1.5"/>',
  thermometer: '<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>',
  fuel: '<line x1="3" y1="22" x2="15" y2="22"/><line x1="4" y1="9" x2="14" y2="9"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2 2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/>',
  zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  chevronRight: '<polyline points="9 18 15 12 9 6"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  trendingUp: '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
  info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>',
  refresh: '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
  terminal: '<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>'
};

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================================
// OBD2 / ELM327 PROTOCOL LAYER
// ============================================================================
var KNOWN_UART_SERVICES = [
  { name: 'Nordic UART (NUS)', service: '6e400001-b5a3-f393-e0a9-e50e24dcca9e', write: '6e400002-b5a3-f393-e0a9-e50e24dcca9e', notify: '6e400003-b5a3-f393-e0a9-e50e24dcca9e' },
  { name: 'Vgate/OBDLink-stijl', service: '18f0', write: '2af1', notify: '2af0' }
];

var PIDS = {
  RPM: { pid: '010C', bytes: 2, parse: function(a, b) { return ((a * 256) + b) / 4; }, unit: 'RPM', max: 7000 },
  SPEED: { pid: '010D', bytes: 1, parse: function(a) { return a; }, unit: 'km/h', max: 220 },
  COOLANT_TEMP: { pid: '0105', bytes: 1, parse: function(a) { return a - 40; }, unit: '°C', max: 120 },
  ENGINE_LOAD: { pid: '0104', bytes: 1, parse: function(a) { return (a * 100) / 255; }, unit: '%', max: 100 },
  FUEL_LEVEL: { pid: '012F', bytes: 1, parse: function(a) { return (a * 100) / 255; }, unit: '%', max: 100 },
  VOLTAGE: { pid: 'ATRV', bytes: 0, parse: null, unit: 'V', max: 16 }
};

var DTC_DATABASE = {
  P0301: { title: 'Ontsteking mist — cilinder 1', severity: 'high', explanation: 'Cilinder 1 ontbrandt het mengsel niet goed. Vaak een bougie, spoel of injector die aan vervanging toe is.', action: 'Laat bougies en ontstekingsspoel van cilinder 1 controleren.' },
  P0302: { title: 'Ontsteking mist — cilinder 2', severity: 'high', explanation: 'Cilinder 2 ontbrandt het mengsel niet goed.', action: 'Laat bougies en ontstekingsspoel van cilinder 2 controleren.' },
  P0420: { title: 'Katalysator werkt onvoldoende', severity: 'medium', explanation: 'De katalysator zuivert de uitlaatgassen niet meer zoals hij zou moeten.', action: 'Controleer eerst de zuurstofsensoren voor je de kat vervangt.' },
  P0171: { title: 'Mengsel te mager — bank 1', severity: 'medium', explanation: 'Er komt te veel lucht of te weinig brandstof het systeem in.', action: 'Controleer op vacuümlekken en reinig de luchtmassameter.' },
  P0128: { title: 'Koelvloeistof bereikt temperatuur niet', severity: 'low', explanation: 'De motor warmt trager op dan verwacht.', action: 'Thermostaat laten vervangen.' },
  P0442: { title: 'Klein lek in verdampingssysteem', severity: 'low', explanation: 'Er zit een klein lek in het brandstofdampsysteem, vaak de tankdop.', action: 'Controleer of de tankdop goed sluit.' }
};

function decodeDTC(hexPair) {
  var firstByte = parseInt(hexPair.substring(0, 2), 16);
  var letterMap = ['P', 'C', 'B', 'U'];
  var letter = letterMap[(firstByte & 0xC0) >> 6];
  var firstDigit = (firstByte & 0x30) >> 4;
  var rest = hexPair.substring(0, 2).padStart(2, '0').substring(1) + hexPair.substring(2, 4);
  return letter + firstDigit + rest;
}

function OBD2Connection() {
  this.device = null;
  this.server = null;
  this.writeChar = null;
  this.notifyChar = null;
  this.buffer = '';
  this.responseResolvers = [];
  this.onLog = null;
  this.onDisconnect = null;
}

OBD2Connection.prototype.log = function(msg) {
  if (this.onLog) this.onLog(msg);
};

OBD2Connection.prototype.connect = function() {
  var self = this;
  if (!navigator.bluetooth) {
    return Promise.reject(new Error('WEB_BLUETOOTH_UNSUPPORTED'));
  }

  self.log('Bluetooth-apparaat kiezen…');
  return navigator.bluetooth.requestDevice({
    filters: KNOWN_UART_SERVICES.map(function(s) { return { services: [s.service] }; }),
    optionalServices: KNOWN_UART_SERVICES.map(function(s) { return s.service; })
  }).then(function(device) {
    self.device = device;
    device.addEventListener('gattserverdisconnected', function() {
      self.log('Verbinding verbroken');
      if (self.onDisconnect) self.onDisconnect();
    });
    self.log('Verbinden met ' + (device.name || 'adapter') + '…');
    return device.gatt.connect();
  }).then(function(server) {
    self.server = server;
    var tryServices = function(idx) {
      if (idx >= KNOWN_UART_SERVICES.length) {
        throw new Error('NO_MATCHING_SERVICE');
      }
      var cfg = KNOWN_UART_SERVICES[idx];
      return server.getPrimaryService(cfg.service).then(function(service) {
        return service.getCharacteristic(cfg.write).then(function(writeChar) {
          return service.getCharacteristic(cfg.notify).then(function(notifyChar) {
            return { service: service, writeChar: writeChar, notifyChar: notifyChar, name: cfg.name };
          });
        });
      }).catch(function() {
        return tryServices(idx + 1);
      });
    };
    return tryServices(0);
  }).then(function(matched) {
    self.log('Protocol herkend: ' + matched.name);
    self.writeChar = matched.writeChar;
    self.notifyChar = matched.notifyChar;

    return self.notifyChar.startNotifications().then(function() {
      self.notifyChar.addEventListener('characteristicvaluechanged', function(event) {
        var value = new TextDecoder().decode(event.target.value);
        self.buffer += value;
        if (self.buffer.indexOf('>') !== -1) {
          var complete = self.buffer;
          self.buffer = '';
          var resolver = self.responseResolvers.shift();
          if (resolver) resolver(complete);
        }
      });
    });
  }).then(function() {
    return self.sendCommand('ATZ', 2000);
  }).then(function() {
    return self.sendCommand('ATE0', 500);
  }).then(function() {
    return self.sendCommand('ATL0', 500);
  }).then(function() {
    return self.sendCommand('ATSP0', 500);
  }).then(function() {
    self.log('Adapter geïnitialiseerd');
    return true;
  });
};

OBD2Connection.prototype.sendCommand = function(cmd, timeout) {
  var self = this;
  timeout = timeout || 3000;
  if (!self.writeChar) return Promise.reject(new Error('NOT_CONNECTED'));

  return new Promise(function(resolve, reject) {
    var timer = setTimeout(function() {
      var idx = self.responseResolvers.indexOf(resolve);
      if (idx > -1) self.responseResolvers.splice(idx, 1);
      reject(new Error('TIMEOUT'));
    }, timeout);

    self.responseResolvers.push(function(raw) {
      clearTimeout(timer);
      resolve(raw.replace(/>/g, '').trim());
    });

    try {
      var encoder = new TextEncoder();
      var data = encoder.encode(cmd + '\r');
      var chunkSize = 20;
      var writeChunk = function(i) {
        if (i >= data.length) return Promise.resolve();
        return self.writeChar.writeValue(data.slice(i, i + chunkSize)).then(function() {
          return writeChunk(i + chunkSize);
        });
      };
      writeChunk(0).catch(function(e) {
        clearTimeout(timer);
        reject(e);
      });
    } catch (e) {
      clearTimeout(timer);
      reject(e);
    }
  });
};

OBD2Connection.prototype.readPID = function(pidDef) {
  return this.sendCommand(pidDef.pid).then(function(raw) {
    if (pidDef.pid === 'ATRV') {
      var match = raw.match(/([\d.]+)V/);
      return match ? parseFloat(match[1]) : null;
    }
    var hexBytes = raw.replace(/\s/g, '').match(/.{1,2}/g) || [];
    var pidHex = pidDef.pid.substring(2);
    var idx = -1;
    for (var i = 0; i < hexBytes.length - 1; i++) {
      if (hexBytes[i].toUpperCase() === pidHex.toUpperCase()) { idx = i; break; }
    }
    if (idx === -1) return null;
    var dataBytes = hexBytes.slice(idx + 1, idx + 1 + pidDef.bytes).map(function(b) { return parseInt(b, 16); });
    for (var j = 0; j < dataBytes.length; j++) { if (isNaN(dataBytes[j])) return null; }
    return pidDef.parse.apply(null, dataBytes);
  });
};

OBD2Connection.prototype.readFaultCodes = function() {
  return this.sendCommand('03', 5000).then(function(raw) {
    var clean = raw.replace(/\s/g, '').replace(/^43/, '');
    if (clean.indexOf('NODATA') === 0 || clean === '' || raw.indexOf('NO DATA') !== -1) return [];
    var codes = [];
    var hexBytes = clean.match(/.{1,2}/g) || [];
    for (var i = 0; i < hexBytes.length; i += 2) {
      if (i + 1 >= hexBytes.length) break;
      var pair = hexBytes[i] + hexBytes[i + 1];
      if (pair === '0000') continue;
      codes.push(decodeDTC(pair));
    }
    return codes;
  });
};

OBD2Connection.prototype.clearFaultCodes = function() {
  return this.sendCommand('04', 5000).then(function(raw) {
    return raw.indexOf('44') !== -1 || raw.toUpperCase().indexOf('OK') !== -1;
  });
};

OBD2Connection.prototype.disconnect = function() {
  if (this.device && this.device.gatt.connected) this.device.gatt.disconnect();
};

// ============================================================================
// APP STATE
// ============================================================================
var state = {
  status: 'disconnected', // disconnected | connecting | connected
  errorMsg: null,
  logs: [],
  selectedCode: null,
  faultCodes: [],
  dtcLoading: false,
  clearing: false,
  showClearConfirm: false,
  liveData: { rpm: null, speed: null, coolant: null, load: null, fuel: null, voltage: null },
  toast: null
};

var conn = null;
var pollInterval = null;
var toastTimer = null;

function addLog(msg) {
  state.logs.push(msg);
  if (state.logs.length > 6) state.logs.shift();
  render();
}

function fetchFaultCodes() {
  if (!conn) return;
  state.dtcLoading = true;
  render();
  conn.readFaultCodes().then(function(codes) {
    state.faultCodes = codes;
    state.dtcLoading = false;
    render();
  }).catch(function(e) {
    addLog('Kon foutcodes niet lezen: ' + e.message);
    state.dtcLoading = false;
    render();
  });
}

function handleConnect() {
  state.errorMsg = null;
  state.logs = [];
  state.status = 'connecting';
  render();

  conn = new OBD2Connection();
  conn.onLog = addLog;
  conn.onDisconnect = function() {
    state.status = 'disconnected';
    if (pollInterval) clearInterval(pollInterval);
    render();
  };

  conn.connect().then(function() {
    state.status = 'connected';
    render();
    fetchFaultCodes();

    pollInterval = setInterval(function() {
      Promise.all([
        conn.readPID(PIDS.RPM).catch(function() { return null; }),
        conn.readPID(PIDS.SPEED).catch(function() { return null; }),
        conn.readPID(PIDS.COOLANT_TEMP).catch(function() { return null; }),
        conn.readPID(PIDS.ENGINE_LOAD).catch(function() { return null; }),
        conn.readPID(PIDS.FUEL_LEVEL).catch(function() { return null; }),
        conn.readPID(PIDS.VOLTAGE).catch(function() { return null; })
      ]).then(function(results) {
        state.liveData = { rpm: results[0], speed: results[1], coolant: results[2], load: results[3], fuel: results[4], voltage: results[5] };
        render();
      }).catch(function() { /* stille fout tijdens polling */ });
    }, 1000);
  }).catch(function(e) {
    state.errorMsg = e.message;
    state.status = 'disconnected';
    render();
  });
}

function handleClearCodes() {
  state.showClearConfirm = false;
  state.clearing = true;
  render();
  conn.clearFaultCodes().then(function() {
    showToast('Foutcodes gewist');
    return new Promise(function(resolve) { setTimeout(resolve, 300); });
  }).then(function() {
    return conn.readFaultCodes();
  }).then(function(codes) {
    state.faultCodes = codes;
    state.clearing = false;
    render();
  }).catch(function() {
    showToast('Wissen mislukt — probeer opnieuw');
    state.clearing = false;
    render();
  });
}

function showToast(msg) {
  state.toast = msg;
  render();
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() {
    state.toast = null;
    render();
  }, 2500);
}

// ============================================================================
// RENDER FUNCTIONS
// ============================================================================
function fmt(value, decimals) {
  return value === null || value === undefined ? '—' : value.toFixed(decimals || 0);
}

function renderGauge(value, max, label, unit, color, iconKey, decimals) {
  var safeValue = value === null || value === undefined ? 0 : value;
  var pct = Math.min(1, safeValue / max);
  return (
    '<div class="obd-gauge">' +
      '<div class="obd-gauge-ring" style="background: conic-gradient(' + color + ' ' + (pct * 260) + 'deg, #1A1D21 0deg)">' +
        '<div class="obd-gauge-face">' +
          svgIcon(ICONS[iconKey], 16, color, 'class="obd-gauge-icon"') +
          '<div class="obd-gauge-value">' + fmt(value, decimals) + '</div>' +
          '<div class="obd-gauge-unit">' + unit + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="obd-gauge-label">' + label + '</div>' +
    '</div>'
  );
}

function renderConnectScreen() {
  var unsupported = state.errorMsg === 'WEB_BLUETOOTH_UNSUPPORTED';
  var html = '<div class="obd-connect-screen">';
  html += '<div class="obd-connect-glow"></div>';
  html += '<div class="obd-connect-icon">' + svgIcon(state.status === 'connecting' ? ICONS.bluetoothConnected : ICONS.bluetooth, 40, null, state.status === 'connecting' ? 'class="obd-pulse"' : '') + '</div>';
  html += '<h1 class="obd-connect-title">DIAGNOSE<span class="obd-connect-title-accent">.LINK</span></h1>';
  html += '<p class="obd-connect-sub">' + (state.status === 'connecting' ? 'Verbinding maken met OBD2-adapter…' : 'Verbind met een echte BLE OBD2-adapter in je auto') + '</p>';

  if (unsupported) {
    html += '<div class="obd-error-box">' + svgIcon(ICONS.alertTriangle, 16) + '<span>Deze browser ondersteunt geen Web Bluetooth. Gebruik Chrome of Edge op Windows, macOS of Android.</span></div>';
  }
  if (state.errorMsg && !unsupported) {
    var msg;
    if (state.errorMsg === 'NO_MATCHING_SERVICE') msg = 'Adapter gevonden, maar het communicatieprotocol werd niet herkend. Mogelijk gebruikt jouw adapter een ander BLE-profiel.';
    else if (state.errorMsg === 'NotFoundError') msg = 'Geen adapter geselecteerd of gevonden.';
    else msg = 'Verbindingsfout: ' + escapeHtml(state.errorMsg);
    html += '<div class="obd-error-box">' + svgIcon(ICONS.alertTriangle, 16) + '<span>' + msg + '</span></div>';
  }

  if (state.status !== 'connecting' && !unsupported) {
    html += '<button class="obd-connect-btn" id="btn-connect">' + svgIcon(ICONS.search, 16) + ' Zoek adapter</button>';
  }
  if (state.status === 'connecting') {
    html += '<div class="obd-connect-scanbar"><div class="obd-connect-scanbar-fill"></div></div>';
  }

  if (state.logs.length > 0) {
    html += '<div class="obd-log-box"><div class="obd-log-header">' + svgIcon(ICONS.terminal, 11) + ' Verbindingslog</div>';
    state.logs.forEach(function(l) { html += '<div class="obd-log-line">' + escapeHtml(l) + '</div>'; });
    html += '</div>';
  }

  html += '<div class="obd-connect-hint">Vereist een BLE (Bluetooth Low Energy) ELM327-adapter — Classic/SPP-adapters werken niet via de browser</div>';
  html += '</div>';
  return html;
}

function renderDTCPanel() {
  var html = '<div class="obd-panel"><div class="obd-panel-header obd-panel-header-row">';
  html += '<span>Foutcodes' + (state.dtcLoading ? '' : ' (' + state.faultCodes.length + ')') + '</span>';
  if (state.faultCodes.length > 0) {
    html += '<button class="obd-clear-btn" id="btn-clear" ' + (state.clearing ? 'disabled' : '') + '>';
    html += state.clearing ? svgIcon(ICONS.refresh, 12, null, 'class="obd-spin"') : svgIcon(ICONS.trash, 12);
    html += (state.clearing ? ' Wissen…' : ' Wis codes') + '</button>';
  }
  html += '</div>';

  if (state.dtcLoading) {
    html += '<div class="obd-empty-state">' + svgIcon(ICONS.refresh, 24, '#8A9099', 'class="obd-spin"') + '<div class="obd-empty-sub">Foutcodes uitlezen…</div></div>';
  } else if (state.faultCodes.length === 0) {
    html += '<div class="obd-empty-state">' + svgIcon(ICONS.checkCircle, 28, '#3DDC97') + '<div class="obd-empty-title">Geen foutcodes gevonden</div><div class="obd-empty-sub">Alle systemen melden normaal gedrag</div></div>';
  } else {
    html += '<div class="obd-dtc-list">';
    state.faultCodes.forEach(function(code) {
      var info = DTC_DATABASE[code] || { title: 'Onbekende code — niet in lokale database', severity: 'medium' };
      html += '<button class="obd-dtc-row" data-code="' + code + '">';
      html += '<div class="obd-dtc-severity obd-sev-' + info.severity + '"></div>';
      html += '<div class="obd-dtc-info"><div class="obd-dtc-code">' + code + '</div><div class="obd-dtc-title">' + escapeHtml(info.title) + '</div></div>';
      html += svgIcon(ICONS.chevronRight, 16, null, 'class="obd-dtc-chevron"');
      html += '</button>';
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderDTCDetail() {
  if (!state.selectedCode) return '';
  var code = state.selectedCode;
  var info = DTC_DATABASE[code] || { title: 'Onbekende code', severity: 'medium', explanation: 'Deze code staat niet in de lokale database.', action: 'Raadpleeg een monteur.' };
  return (
    '<div class="obd-modal-backdrop" id="detail-backdrop">' +
      '<div class="obd-modal" id="detail-modal">' +
        '<button class="obd-modal-close" id="btn-close-detail">' + svgIcon(ICONS.x, 18) + '</button>' +
        '<div class="obd-dtc-severity obd-sev-' + info.severity + ' obd-modal-sev"></div>' +
        '<div class="obd-modal-code">' + code + '</div>' +
        '<div class="obd-modal-title">' + escapeHtml(info.title) + '</div>' +
        '<div class="obd-modal-section"><div class="obd-modal-label">' + svgIcon(ICONS.info, 13) + ' Wat betekent dit</div><p>' + escapeHtml(info.explanation) + '</p></div>' +
        '<div class="obd-modal-section"><div class="obd-modal-label">' + svgIcon(ICONS.trendingUp, 13) + ' Aanbevolen actie</div><p>' + escapeHtml(info.action) + '</p></div>' +
      '</div>' +
    '</div>'
  );
}

function renderClearConfirm() {
  if (!state.showClearConfirm) return '';
  return (
    '<div class="obd-modal-backdrop" id="clear-backdrop">' +
      '<div class="obd-modal" id="clear-modal">' +
        svgIcon(ICONS.alertTriangle, 28, '#E8B84B', 'style="margin-bottom:12px"') +
        '<div class="obd-modal-title" style="margin-bottom:8px">Foutcodes wissen?</div>' +
        '<p style="font-size:13.5px;color:#C4C8CD;line-height:1.6;margin-bottom:20px">Dit wist het geheugen van de ECU, niet het onderliggende probleem. Als het mankement er nog is, komt de code na een paar ritten vaak terug. Gebruik dit vooral ná een reparatie, om te bevestigen dat het probleem echt weg is.</p>' +
        '<div style="display:flex;gap:10px">' +
          '<button class="obd-modal-cancel" id="btn-cancel-clear">Annuleren</button>' +
          '<button class="obd-modal-confirm" id="btn-confirm-clear">Ja, wis codes</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

function render() {
  var app = document.getElementById('app');
  var html = '';

  if (state.status !== 'connected') {
    html += renderConnectScreen();
  } else {
    html += '<div class="obd-topbar"><div class="obd-brand">DIAGNOSE<span class="obd-brand-accent">.LINK</span></div>';
    html += '<div class="obd-conn-badge">' + svgIcon(ICONS.bluetoothConnected, 12) + ' Verbonden</div></div>';

    html += '<div class="obd-gauges">';
    html += renderGauge(state.liveData.rpm, 7000, 'Toerental', 'RPM', '#FF6B35', 'gauge', 0);
    html += renderGauge(state.liveData.speed, 180, 'Snelheid', 'KM/H', '#3DDC97', 'zap', 0);
    html += renderGauge(state.liveData.coolant, 120, 'Koelvloeistof', '°C', '#4B9FE8', 'thermometer', 0);
    html += '</div>';

    html += '<div class="obd-stats-row">';
    html += '<div class="obd-stat-card"><div class="obd-stat-icon">' + svgIcon(ICONS.fuel, 15) + '</div><div><div class="obd-stat-value">' + (state.liveData.fuel === null ? '—' : fmt(state.liveData.fuel, 0) + '%') + '</div><div class="obd-stat-label">Brandstofniveau</div></div></div>';
    html += '<div class="obd-stat-card"><div class="obd-stat-icon">' + svgIcon(ICONS.zap, 15) + '</div><div><div class="obd-stat-value">' + (state.liveData.voltage === null ? '—' : fmt(state.liveData.voltage, 1) + 'V') + '</div><div class="obd-stat-label">Accuspanning</div></div></div>';
    html += '</div>';

    html += renderDTCPanel();
  }

  html += renderDTCDetail();
  html += renderClearConfirm();

  if (state.toast) {
    html += '<div class="obd-toast">' + svgIcon(ICONS.checkCircle, 15, '#3DDC97') + ' ' + escapeHtml(state.toast) + '</div>';
  }

  app.innerHTML = html;
  attachEvents();
}

function attachEvents() {
  var btnConnect = document.getElementById('btn-connect');
  if (btnConnect) btnConnect.addEventListener('click', handleConnect);

  var btnClear = document.getElementById('btn-clear');
  if (btnClear) btnClear.addEventListener('click', function() { state.showClearConfirm = true; render(); });

  var dtcRows = document.querySelectorAll('.obd-dtc-row');
  dtcRows.forEach(function(row) {
    row.addEventListener('click', function() {
      state.selectedCode = row.getAttribute('data-code');
      render();
    });
  });

  var detailBackdrop = document.getElementById('detail-backdrop');
  if (detailBackdrop) {
    detailBackdrop.addEventListener('click', function(e) {
      if (e.target === detailBackdrop) { state.selectedCode = null; render(); }
    });
  }
  var btnCloseDetail = document.getElementById('btn-close-detail');
  if (btnCloseDetail) btnCloseDetail.addEventListener('click', function() { state.selectedCode = null; render(); });

  var clearBackdrop = document.getElementById('clear-backdrop');
  if (clearBackdrop) {
    clearBackdrop.addEventListener('click', function(e) {
      if (e.target === clearBackdrop) { state.showClearConfirm = false; render(); }
    });
  }
  var btnCancelClear = document.getElementById('btn-cancel-clear');
  if (btnCancelClear) btnCancelClear.addEventListener('click', function() { state.showClearConfirm = false; render(); });
  var btnConfirmClear = document.getElementById('btn-confirm-clear');
  if (btnConfirmClear) btnConfirmClear.addEventListener('click', handleClearCodes);
}

window.addEventListener('beforeunload', function() {
  if (pollInterval) clearInterval(pollInterval);
  if (conn) conn.disconnect();
});

// Eerste render
render();
</script>
</body>
</html>
